[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "secureai"
version = "0.1.0"
description = "AI-powered security vulnerability detector, fix generator, and semantic code search engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Tamim Chowdhury"}
]
keywords = ["security", "vulnerability", "static-analysis", "llm", "code-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    # Core ML
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "tokenizers>=0.19.0",
    "datasets>=2.19.0",
    "accelerate>=0.30.0",
    "peft>=0.11.0",            # LoRA / QLoRA
    "trl>=0.9.0",              # SFT + RLHF (PPO/DPO)
    "einops>=0.8.0",
    "sentencepiece>=0.2.0",

    # Graph ML
    "torch-geometric>=2.5.0",

    # Static Analysis
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-java>=0.21.0",

    # Vector Store
    "qdrant-client>=1.9.0",
    "faiss-cpu>=1.8.0",

    # Graph DB
    "neo4j>=5.20.0",

    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",

    # Data
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",

    # CLI
    "click>=8.1.0",
    "rich>=13.7.0",

    # MLOps
    "mlflow>=2.13.0",

    # Utilities
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "tqdm>=4.66.0",
    "tenacity>=8.3.0",         # retry logic for API calls
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "ipykernel>=6.29.0",
]
training = [
    "wandb>=0.17.0",
    "deepspeed>=0.14.0",
    "flash-attn>=2.5.0",
]

[project.scripts]
secureai = "interfaces.cli.main:cli"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
