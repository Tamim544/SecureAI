version: "3.9"

services:
  # PostgreSQL - metadata store
  postgres:
    image: postgres:16-alpine
    container_name: secureai_postgres
    environment:
      POSTGRES_DB: secureai
      POSTGRES_USER: secureai
      POSTGRES_PASSWORD: secureai_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Neo4j - CVE/CWE knowledge graph
  neo4j:
    image: neo4j:5.20-community
    container_name: secureai_neo4j
    environment:
      NEO4J_AUTH: neo4j/secureai_neo4j
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_memory_pagecache_size: 1G
      NEO4J_dbms_memory_heap_initial__size: 512M
      NEO4J_dbms_memory_heap_max__size: 1G
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "secureai_neo4j", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # Qdrant - vector store
  qdrant:
    image: qdrant/qdrant:latest
    container_name: secureai_qdrant
    ports:
      - "6333:6333"   # HTTP API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - job queue + cache
  redis:
    image: redis:7-alpine
    container_name: secureai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
  redis_data:

networks:
  default:
    name: secureai_network
